; PHP-FPM optimization for Nextcloud (static config for Quadlet)
; Based on 16GB RAM system - adjust pm.* values as needed

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

; Security
session.hash_function = sha256
session.use_cookies = On
session.use_strict_mode = On
session.cookie_httponly = On
session.cookie_secure = On
allow_url_fopen = Off
allow_url_include = Off
display_errors = Off
expose_php = Off

; Timeouts
max_execution_time = 3600
max_input_time = 3600
memory_limit = 512M
