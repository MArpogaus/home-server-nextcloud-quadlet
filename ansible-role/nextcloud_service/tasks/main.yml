---
# Nextcloud Service Deployment Role
# Deploys Quadlet services for Nextcloud
# No specific configuration - uses files from this repository

- name: Ensure Nextcloud user home directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_service_home | default('/var/services/nextcloud') }}/.config/systemd/user"
    state: directory
    owner: "{{ nextcloud_service_user | default('nextcloud') }}"
    mode: "0755"

- name: Deploy Nextcloud Quadlet container files
  ansible.builtin.copy:
    src: "../quadlets/"
    dest: "{{ nextcloud_service_home | default('/var/services/nextcloud') }}/.config/systemd/user/"
    owner: "{{ nextcloud_service_user | default('nextcloud') }}"
    mode: "0644"
    directory_mode: "0755"

- name: Deploy Nextcloud nginx configuration
  ansible.builtin.copy:
    src: "../containers/context/configs/nginx.conf"
    dest: "{{ nextcloud_service_home | default('/var/services/nextcloud') }}/.config/systemd/user/configs/nginx.conf"
    owner: "{{ nextcloud_service_user | default('nextcloud') }}"
    mode: "0644"
  when: nextcloud_deploy_nginx_config | default(true)

- name: Notify to reload systemd user daemon
  ansible.builtin.debug:
    msg: "Nextcloud Quadlet services deployed. Run 'run0 systemctl --user daemon-reload --machine={{ nextcloud_service_user | default('nextcloud') }}@' to activate."
