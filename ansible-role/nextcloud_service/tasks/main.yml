---
# Nextcloud service deployment — fully self-contained
# Receives: service_name, service_user, service_uid, service_home, service_repo

- name: Ensure service data directories
  ansible.builtin.file:
    path: "{{ service_home }}/{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    mode: '0755'
  loop:
    - data/db_data
    - data/data
    - data/config
    - bin

- name: Deploy pre-snapshot pg_dumpall script
  ansible.builtin.copy:
    src: pre-snapshot-pg-dump.sh
    dest: "{{ service_home }}/bin/pre-snapshot-pg-dump.sh"
    owner: "{{ service_user }}"
    mode: '0755'

- name: Template pg_dumpall systemd service
  ansible.builtin.template:
    src: pg-dumpall.service.j2
    dest: /etc/systemd/system/pg-dumpall.service
    owner: root
    mode: '0644'

- name: Template pg_dumpall systemd timer
  ansible.builtin.template:
    src: pg-dumpall.timer.j2
    dest: /etc/systemd/system/pg-dumpall.timer
    owner: root
    mode: '0644'

- name: Enable and start pg_dumpall timer
  ansible.builtin.systemd:
    name: pg-dumpall.timer
    enabled: true
    state: started
    scope: system

- name: Deploy static Quadlet files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - shared-network.network
    - nc.pod
    - promtail-nc.container
    - promtail-nc.pod

- name: Template container Quadlet files
  ansible.builtin.template:
    src: "{{ service_repo }}/quadlets/nextcloud-{{ item }}.container.j2"
    dest: "{{ service_home }}/.config/containers/systemd/nextcloud-{{ item }}.container"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - db
    - redis
    - app
    - web
    - cron
    - push
    - preview-generator

- name: Ensure configs directory exists
  ansible.builtin.file:
    path: "{{ service_home }}/.config/containers/systemd/configs"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0755'

- name: Deploy config files
  ansible.builtin.copy:
    src: "{{ service_repo }}/quadlets/configs/{{ item }}"
    dest: "{{ service_home }}/.config/containers/systemd/configs/{{ item }}"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'
  loop:
    - promtail-nc.yaml

- name: Template nginx config
  ansible.builtin.template:
    src: "{{ service_repo }}/quadlets/configs/nginx.conf.j2"
    dest: "{{ service_home }}/.config/containers/systemd/configs/nginx.conf"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0644'

- name: Template nextcloud environment file
  ansible.builtin.template:
    src: "{{ service_repo }}/ansible-role/nextcloud_service/templates/nextcloud.env.j2"
    dest: "{{ service_home }}/.config/containers/systemd/configs/nextcloud.env"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: '0600'

- name: Pre-create Podman volumes for Nextcloud
  ansible.builtin.command:
    cmd: "machinectl shell {{ service_user }}@ /usr/bin/podman volume create --ignore {{ item }}"
  loop:
    - nc-app-html
    - nc-app-apps
    - nc-app-config
    - nc-app-data
    - nc-app-logs
    - nc-db
    - nc-web-cache

- name: Pre-seed html volume with Nextcloud source files
  ansible.builtin.command:
    cmd: "machinectl shell {{ service_user }}@ /usr/bin/podman run --rm -v nc-app-html:/var/www/html:z --entrypoint /bin/sh {{ nextcloud_image | lower }} -c 'cp -a /usr/src/nextcloud/. /var/www/html/'"
  failed_when: false

- name: Fix volume ownership to www-data (33) in podman user namespace
  ansible.builtin.shell: |
    machinectl shell {{ service_user }}@ /usr/bin/bash -c '
      podman unshare chown -R 33:33 \
        {{ service_home }}/.local/share/containers/storage/volumes/nc-app-html/_data \
        {{ service_home }}/.local/share/containers/storage/volumes/nc-app-apps/_data \
        {{ service_home }}/.local/share/containers/storage/volumes/nc-app-logs/_data \
        {{ service_home }}/data/data \
        {{ service_home }}/data/config
    '
