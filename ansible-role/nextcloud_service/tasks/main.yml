---
# Nextcloud service role - data directories and config only
# Quadlet files are deployed via site.yml using root Podman

- name: Ensure service data directories for Btrfs snapshots
  ansible.builtin.file:
    path: "{{ nextcloud_service_home }}/{{ item }}"
    state: directory
    owner: "{{ nextcloud_service_user }}"
    mode: "0755"
  loop:
    - data/db_data
    - data/data
    - data/config
    - bin

- name: Deploy pre-snapshot pg_dumpall script
  ansible.builtin.copy:
    src: pre-snapshot-pg-dump.sh
    dest: "{{ nextcloud_service_home }}/bin/pre-snapshot-pg-dump.sh"
    owner: "{{ nextcloud_service_user }}"
    mode: "0755"

- name: Deploy system-level pg_dumpall service unit
  ansible.builtin.template:
    src: pg-dumpall.service.j2
    dest: /etc/systemd/system/pg-dumpall.service
    owner: root
    mode: "0644"

- name: Deploy system-level pg_dumpall timer unit
  ansible.builtin.template:
    src: pg-dumpall.timer.j2
    dest: /etc/systemd/system/pg-dumpall.timer
    owner: root
    mode: "0644"

- name: Enable and start pg_dumpall timer
  ansible.builtin.systemd:
    name: pg-dumpall.timer
    enabled: true
    state: started
    scope: system
  become: true

- name: Pre-set data directory ownership for root Podman
  ansible.builtin.command:
    cmd: "chown -R 33:33 {{ nextcloud_service_home }}/data/{{ item }}"
  loop:
    - data
    - config
  changed_when: true
  failed_when: false
