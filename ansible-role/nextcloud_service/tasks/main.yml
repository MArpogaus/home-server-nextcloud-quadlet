---
- name: Ensure Nextcloud user home directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_service_home }}/.config/containers/systemd/configs"
    state: directory
    owner: "{{ nextcloud_service_user }}"
    mode: "0755"

- name: Deploy Nextcloud Quadlet template files (containers)
  ansible.builtin.template:
    src: "quadlets/{{ item }}.container.j2"
    dest: "{{ nextcloud_service_home }}/.config/containers/systemd/{{ item }}.container"
    owner: "{{ nextcloud_service_user }}"
    mode: "0644"
  loop:
    - nextcloud-db
    - nextcloud-redis
    - nextcloud-app
    - nextcloud-web
    - nextcloud-cron
    - nextcloud-push
    - nextcloud-preview-generator

- name: Deploy Nextcloud Quadlet static files (volume, network)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nextcloud_service_home }}/.config/containers/systemd/"
    owner: "{{ nextcloud_service_user }}"
    mode: "0644"
  loop: "{{ query('fileglob', nextcloud_service_role_dir + '/../../quadlets/*.volume') + query('fileglob', nextcloud_service_role_dir + '/../../quadlets/*.network') }}"

- name: Template Nextcloud environment file (secrets)
  ansible.builtin.template:
    src: nextcloud.env.j2
    dest: "{{ nextcloud_service_home }}/.config/containers/systemd/configs/nextcloud.env"
    owner: "{{ nextcloud_service_user }}"
    mode: "0600"

- name: Template nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nextcloud_service_home }}/.config/containers/systemd/configs/nginx.conf"
    owner: "{{ nextcloud_service_user }}"
    mode: "0644"

- name: Reload systemd user daemon for Nextcloud
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ nextcloud_service_user }}"

- name: Enable and start core Nextcloud Quadlet services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ nextcloud_service_user }}"
  loop:
    - nextcloud-db
    - nextcloud-redis
    - nextcloud-app
    - nextcloud-web
    - nextcloud-cron

- name: Enable and start optional Nextcloud services (require custom images)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ nextcloud_service_user }}"
  loop:
    - nextcloud-push
    - nextcloud-preview-generator
  failed_when: false
