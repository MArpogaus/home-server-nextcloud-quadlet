[global]
error_log = /var/log/nextcloud/php-fpm.log

; https://github.com/docker-library/php/pull/725#issuecomment-443540114
log_limit = 8192

[www]
; php-fpm closes STDOUT on startup, so sending logs to /proc/self/fd/1 does not work.
; https://bugs.php.net/bug.php?id=73886
; ponytail: replaced /proc/self/fd/2 — not accessible in rootless podman user namespaces
access.log = /var/log/nextcloud/php-fpm.log

clear_env = no

; Ensure worker stdout and stderr are sent to the main error log.
catch_workers_output = yes
decorate_workers_output = no

; default listen address for easy override in later php-fpm.d/*.conf files
listen = 9000
